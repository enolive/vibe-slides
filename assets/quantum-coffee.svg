<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="mugGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5a3a22"/>
      <stop offset="100%" stop-color="#2a160a"/>
    </radialGradient>
    <radialGradient id="reality1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff00ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff00ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="reality2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="reality3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffff00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffff00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coffeeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="#0d0221" rx="20"/>
  <!-- branching reality steam -->
  <path d="M 75 95 Q 60 70 50 45 Q 48 30 40 20" stroke="#ff00ff" stroke-width="2" fill="none" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M 100 90 Q 100 60 100 30 Q 102 15 95 8" stroke="#00ffff" stroke-width="2" fill="none" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M 125 95 Q 140 70 150 45 Q 152 30 160 20" stroke="#ffff00" stroke-width="2" fill="none" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <!-- orbiting realities -->
  <circle cx="40" cy="20" r="14" fill="url(#reality1)">
    <animate attributeName="r" values="14;18;14" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="8" r="14" fill="url(#reality2)">
    <animate attributeName="r" values="14;18;14" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="20" r="14" fill="url(#reality3)">
    <animate attributeName="r" values="14;18;14" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="20" r="4" fill="#ff00ff"/>
  <circle cx="100" cy="8" r="4" fill="#00ffff"/>
  <circle cx="160" cy="20" r="4" fill="#ffff00"/>
  <!-- coffee mug -->
  <path d="M 55 100 L 60 165 Q 60 175 70 175 L 130 175 Q 140 175 140 165 L 145 100 Z" fill="url(#mugGrad)" stroke="#8a5a33" stroke-width="2"/>
  <!-- handle -->
  <path d="M 145 115 Q 170 115 170 135 Q 170 155 145 155" stroke="#8a5a33" stroke-width="6" fill="none"/>
  <!-- coffee surface glow -->
  <ellipse cx="100" cy="100" rx="45" ry="8" fill="url(#coffeeGlow)"/>
  <ellipse cx="100" cy="100" rx="43" ry="7" fill="#3a1f0e"/>
  <!-- quantum coffee ripples -->
  <ellipse cx="100" cy="100" rx="20" ry="3" fill="none" stroke="#ffb347" stroke-width="1" opacity="0.6">
    <animate attributeName="rx" values="10;35;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <!-- infinity on mug -->
  <text x="100" y="142" font-family="Courier New" font-size="22" fill="#ffb347" text-anchor="middle" font-weight="bold">∞</text>
</svg>
